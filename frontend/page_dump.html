}

.form-group {

}

label {

}

input:focus {

}

/* Buttons */
.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  padding: 0.5rem 1rem;
  font-size: 1rem;
  font-weight: 500;
  border: 1px solid transparent;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background-color 0.15s ease-in-out;
}

.btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;

.btn-primary {

  color: white;

.btn-primary:hover:not(:disabled) {

.btn-secondary {

}
.btn-secondary:hover:not(:disabled) {
  background-color: #f3f4f6;
}

.card {

  border-radius: var(--radius);
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 1rem;
}

.alert {

}

.alert-error {

}

.nav-link {

}
.nav-link:hover {

  text-decoration: none;
}
